<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#f8f9fd" />
    <title>Users | Admin | Xyrra</title>
    <link rel="icon" href="/favicon.png" type="image/png" sizes="any" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/admin/admin.css" />
  </head>
  <body class="xa-body">
    <div id="xa-admin-loading" class="xa-loading" role="status" aria-live="polite">
      Checking session…
    </div>

    <div class="xa-admin" id="xa-admin-app" hidden>
      <header class="xa-admin__bar">
        <a class="xa-brand" href="/admin/" aria-label="Xyrra admin home">
          <img src="/images/new/xyrra-logo.png" alt="" width="954" height="115" decoding="async" />
        </a>
        <div class="xa-admin__bar-actions">
          <div class="xa-admin__meta">
            <strong id="xa-admin-email">…</strong>
            <span id="xa-admin-role">…</span>
          </div>
          <button type="button" id="xa-admin-signout" class="xa-admin__signout">Sign out</button>
        </div>
      </header>

      <div class="xa-admin__layout">
        <aside class="xa-admin__sidebar" aria-label="Admin navigation">
          <nav class="xa-admin__nav">
            <a class="xa-admin__nav-link" data-xa-nav="dashboard" href="/admin/">Dashboard</a>
            <a class="xa-admin__nav-link" data-xa-nav="users" href="/admin/users/">Users</a>
            <a class="xa-admin__nav-link" data-xa-nav="email-templates" href="/admin/email-templates/">Email Templates</a>
            <a class="xa-admin__nav-link" data-xa-nav="email-lists" href="/admin/email-lists/">Email Lists</a>
            <a class="xa-admin__nav-link" data-xa-nav="email-outreach" href="/admin/email-outreach/">Email Outreach</a>
            <a class="xa-admin__nav-link" data-xa-nav="emails-sent" href="/admin/emails-sent/">Emails Sent</a>
          </nav>
        </aside>

        <main class="xa-admin__main">
          <div class="xa-admin__panel">
            <div class="xa-users__header">
              <div>
                <h1>Users</h1>
                <p id="xa-users-summary" class="xa-users__summary">Loading…</p>
              </div>
              <label class="xa-users__search">
                <span class="xa-sr-only">Search users</span>
                <input
                  id="xa-users-search"
                  type="search"
                  placeholder="Search name or email…"
                  autocomplete="off"
                />
              </label>
            </div>

            <p id="xa-users-status" class="xa-users__status" aria-live="polite">Loading users…</p>

            <div class="xa-users__table-wrap">
              <table class="xa-users__table">
                <thead>
                  <tr>
                    <th scope="col">
                      <button type="button" class="xa-users__sort" data-sort="old_id">Old ID</button>
                    </th>
                    <th scope="col">
                      <button type="button" class="xa-users__sort" data-sort="name">Name</button>
                    </th>
                    <th scope="col">
                      <button type="button" class="xa-users__sort" data-sort="f_name">First name</button>
                    </th>
                    <th scope="col">
                      <button type="button" class="xa-users__sort" data-sort="l_name">Last name</button>
                    </th>
                    <th scope="col">
                      <button type="button" class="xa-users__sort" data-sort="email">Email</button>
                    </th>
                    <th scope="col">
                      <button type="button" class="xa-users__sort" data-sort="created">Created</button>
                    </th>
                  </tr>
                </thead>
                <tbody id="xa-users-body">
                  <tr>
                    <td colspan="6" class="xa-users__empty">Loading…</td>
                  </tr>
                </tbody>
              </table>
            </div>

            <div class="xa-users__pagination">
              <button type="button" id="xa-users-prev" class="xa-admin__signout">Previous</button>
              <span id="xa-users-page">Page 1 of 1</span>
              <button type="button" id="xa-users-next" class="xa-admin__signout">Next</button>
            </div>
          </div>
        </main>
      </div>
    </div>

    <script type="module" src="/src/admin/users.ts"></script>
  </body>
</html>
